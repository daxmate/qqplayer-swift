name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  swift:
    name: Swift (swiftlint + swiftformat + xcodebuild test)
    # 单元测试（Swift Testing，QQPlayerTests target）+ lint/format 检查。
    # 配置在仓库根 .swiftlint.yml / .swiftformat，swiftlint/swiftformat 自动发现。
    # 注意：QQPlayerSiriTests（UI 集成测试）依赖上游 Xcode 27 的 AppIntentsTesting 框架，
    # 当前 Xcode 26 SDK 无此框架编译不过，已从 scheme Test action 移除，不参与 CI。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install swiftlint swiftformat

      - name: Lint (swiftlint)
        run: swiftlint lint

      - name: Format (swiftformat --lint)
        run: swiftformat --lint .

      # SPM 依赖（SFBAudioEngine 等）首次拉取+编译 30-40 分钟，必须缓存：
      #   - ~/Library/Caches/org.swift.swiftpm（包源码/解析结果）
      #   - build/DerivedData（编译产物，命中后 xcodebuild 增量秒级）
      # key 绑定 Package.resolved 内容，依赖不变即命中。
      - name: Cache SPM packages + DerivedData
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/DerivedData
          # v2: 仓库改名 qqplayer-ios → qqplayer-swift 后 runner 工作目录路径变化，旧缓存内 SPM
          # artifacts 绝对路径指向旧目录导致 "no XCFramework found"，bump key 强制缓存重建。
          # 注意 restore-keys 必须同步带 v2 前缀：v1 旧缓存的 artifacts 绝对路径已失效，
          # 若被 restore-keys 前缀命中会恢复出坏缓存，照样 no XCFramework found。
          key: ${{ runner.os }}-spm-v2-${{ hashFiles('QQPlayer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-v2-

      # destination 动态取第一个可用 iPhone 模拟器：macos-latest runner 的 Xcode/模拟器型号随系统镜像
      # 更新而变（iPhone 16/17 系列都可能），写死型号会随镜像升级失配；动态选取在任何镜像上都成立。
      # （本机已验证等价命令：iPhone 17 Pro 上 xcodebuild test 全绿，9 tests / 2 suites）
      - name: Test (xcodebuild test, iOS simulator)
        run: |
          set -o pipefail
          DEVICE="$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | sed 's/ *$//')"
          if [ -z "$DEVICE" ]; then
            echo "❌ 无可用 iPhone 模拟器（xcrun simctl list devices available）"
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          # tee 落盘供下一步零容忍警告检测；pipefail 保证 xcodebuild 失败不被管道吞掉
          xcodebuild test \
            -project QQPlayer.xcodeproj \
            -scheme QQPlayer \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build/DerivedData \
            -only-testing:QQPlayerTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild-ios.log

      # 编译警告零容忍（2026-09-08 用户立规矩）：源码警告（路径含 /QQPlayer/ 或 /QQPlayerTests/）
      # + 工程级警告（行尾含 "(in target ...)"，如缺 LSApplicationCategory）一律拦截，当场清零。
      # 排除 appintentsmetadataprocessor 的 "Metadata extraction skipped"（无 AppIntents 依赖的
      # 正常工具提示，非编译警告）。三方 SPM 包（路径在 SourcePackages/checkouts）不拦——改不到。
      - name: Check zero warnings (source + target-level)
        run: |
          set -euo pipefail
          WARN="$(grep -E 'warning:' /tmp/xcodebuild-ios.log \
            | grep -v 'Metadata extraction skipped' \
            | grep -E '/(QQPlayer|QQPlayerTests)/|\(in target' \
            | sort -u || true)"
          if [ -n "$WARN" ]; then
            echo "❌ 检测到编译警告（零容忍纪律，须当场清零）："
            printf '%s\n' "$WARN"
            echo "提示：Debug 增量编译会掩盖存量警告，本地请用 Release + 全 target 全量编译核对"
            exit 1
          fi
          echo "✅ 无源码/工程级编译警告"

  macos:
    name: macOS (build QQPlayerMac + 资源产物断言)
    # macOS 原生版（QQPlayerMac target）编译级验证。
    # 历史教训（2026-08-31）：macOS 版首测三 bug 全是"能编译但行为错"——
    # ① App 图标没生效（Contents.json 缺 mac 条目 + target 缺 APPICON_NAME）
    # ② sidebar 与交通灯重叠 ③ 扫描从不执行（isIndexing 未置 true）→ 库永远为空。
    # 其中图标类问题可用产物断言抓住：AppIcon.icns / Assets.car 必须在 app 里。
    # 编译级验证无法覆盖布局/行为，macOS 单测 target 后续补齐。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache SPM packages + DerivedData (macOS)
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/DerivedDataMac
          key: ${{ runner.os }}-spm-mac-v2-${{ hashFiles('QQPlayer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-mac-v2-

      - name: Build QQPlayerMac
        run: |
          set -o pipefail
          # tee 落盘供下一步零容忍警告检测；pipefail 保证 build 失败不被管道吞掉
          xcodebuild build \
            -project QQPlayer.xcodeproj \
            -scheme QQPlayerMac \
            -configuration Debug \
            -derivedDataPath build/DerivedDataMac \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild-macos.log

      # 编译警告零容忍（同 swift job）：macOS target 源码同在 QQPlayer/ 目录，覆盖 QQPlayer/Mac/*
      - name: Check zero warnings (source + target-level)
        run: |
          set -euo pipefail
          WARN="$(grep -E 'warning:' /tmp/xcodebuild-macos.log \
            | grep -v 'Metadata extraction skipped' \
            | grep -E '/(QQPlayer|QQPlayerTests)/|\(in target' \
            | sort -u || true)"
          if [ -n "$WARN" ]; then
            echo "❌ 检测到编译警告（零容忍纪律，须当场清零）："
            printf '%s\n' "$WARN"
            echo "提示：Debug 增量编译会掩盖存量警告，本地请用 Release + 全 target 全量编译核对"
            exit 1
          fi
          echo "✅ 无源码/工程级编译警告"

      - name: Assert app resources (AppIcon + Assets.car)
        run: |
          APP="build/DerivedDataMac/Build/Products/Debug/QQPlayerMac.app"
          test -f "$APP/Contents/Resources/AppIcon.icns" || { echo "❌ AppIcon.icns 缺失——AppIcon.appiconset 无 mac 条目或 target 缺 ASSETCATALOG_COMPILER_APPICON_NAME"; exit 1; }
          test -f "$APP/Contents/Resources/Assets.car" || { echo "❌ Assets.car 缺失——Assets.xcassets 未进 QQPlayerMac target 资源阶段"; exit 1; }
          echo "✅ AppIcon.icns + Assets.car 均在产物中"
