name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：本 workflow 只需读代码（actions/cache 自行鉴权），
# 不授予写仓库/PR/issue 的 GITHUB_TOKEN 权限。
permissions:
  contents: read

# 同一分支连推只保留最新一次 run（旧 run 取消），避免密集 push 并行跑多份占满 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift (swiftlint + swiftformat + xcodebuild test)
    # 单元测试（Swift Testing，QQPlayerTests target）+ lint/format 检查。
    # 配置在仓库根 .swiftlint.yml / .swiftformat，swiftlint/swiftformat 自动发现。
    #
    # ⚠️ QQPlayerSiriTests 不参与本 job，且**在本地也无法编译**（可核查证据）：
    #   该 target 的 4 个文件都 `import AppIntentsTesting`
    #     （BaseTestCase.swift:12 / EntityQueryTests.swift:9 /
    #       IntentExecutionTests.swift:9 / SpotlightTests.swift:10），
    #   而 Xcode 26.6 的 iPhoneSimulator26.5.sdk **不提供 AppIntentsTesting 框架**：
    #     $ ls /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/Library/Frameworks/
    #       → XCTest.framework  XCUIAutomation.framework  Testing.framework（无 AppIntentsTesting）
    #     $ find /Applications/Xcode.app -iname "*AppIntentsTesting*"
    #       → 无输出
    #   因此它既不在任何 scheme 的 Testables 里（QQPlayer.xcscheme 唯一 Testable = QQPlayerTests），
    #   也无法被 xcodebuild 编译——不是「本 job 偷懒」，而是当前工具链硬限制。
    #   为不让这条线静默烂掉，下一个 step 跑 scripts/siri-tests-guard.py：
    #   结构级守护（文件齐备 + 测试字符串索引的 intent/entity/enum 名仍可解析）
    #   + 金丝雀（工具链出现 AppIntentsTesting 即失败，提醒接回 scheme/CI）。
    #   测试文件本身**不允许删除或静默降级**。
    timeout-minutes: 90
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # lint 工具锁版本（2026-09-12）：`brew install` 不锁版本，swiftlint/swiftformat
      # 规则集随上游最新版漂移，会在无关提交上突然连红。改为固定发布的 release 资产，
      # 并**自校验版本号**——资产布局或版本不符一律当场失败，绝不静默退回别的版本。
      #
      # 资产取舍（已核对 GitHub release 清单，非推测）：
      #   - SwiftLint.arm64.zip / SwiftLint.amd64.zip / *.msi 是 **Windows** 包
      #     （解包只得 `swiftlint.exe`），macOS 官方分发只有 SwiftLint.pkg；
      #     portable_swiftlint.zip 是 Linux 静态二进制——三者都不能用于 macos runner。
      #   - SwiftFormat 的 swiftformat.zip 是 macOS 二进制（解包得 `swiftformat`）。
      # 因此 SwiftLint 走 .pkg（sudo installer）+ 动态解析出来的可执行路径，
      # 而不是写死安装目录（pkg 的 install-location 不保证固定）。
      - name: Install pinned lint tools
        env:
          SWIFTLINT_VERSION: 0.65.1
          SWIFTFORMAT_VERSION: 0.62.1
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/lintbin"
          mkdir -p "$BIN"

          # ① SwiftLint：macOS 官方 pkg
          curl -fsSL -o "$RUNNER_TEMP/SwiftLint.pkg" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/SwiftLint.pkg"
          sudo installer -pkg "$RUNNER_TEMP/SwiftLint.pkg" -target /
          SL_FOUND="$(command -v swiftlint || true)"
          if [ -z "$SL_FOUND" ]; then
            SL_FOUND="$(find /usr/local/bin /opt/homebrew/bin /usr/local/swiftlint -maxdepth 2 -type f -name swiftlint 2>/dev/null | head -1)"
          fi
          test -n "$SL_FOUND" || { echo "❌ pkg 安装后未找到 swiftlint 可执行文件"; exit 1; }

          # ② SwiftFormat：release zip → 目录内找可执行文件（布局变化也不会静默用错版本）
          curl -fsSL -o "$RUNNER_TEMP/sf.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -qo "$RUNNER_TEMP/sf.zip" -d "$RUNNER_TEMP/sf"
          SF_BIN="$(find "$RUNNER_TEMP/sf" -type f -name swiftformat | head -1)"
          test -n "$SF_BIN" || { echo "❌ SwiftFormat 发布包内未找到 swiftformat"; exit 1; }
          chmod +x "$SF_BIN"

          # ③ 版本自校验（不匹配即失败，绝不“差不多就先用”）
          SL_ACTUAL="$("$SL_FOUND" version)"
          [ "$SL_ACTUAL" = "$SWIFTLINT_VERSION" ] \
            || { echo "❌ swiftlint 版本不是 $SWIFTLINT_VERSION，实际：$SL_ACTUAL"; exit 1; }
          SF_ACTUAL="$("$SF_BIN" --version)"
          [ "$SF_ACTUAL" = "$SWIFTFORMAT_VERSION" ] \
            || { echo "❌ swiftformat 版本不是 $SWIFTFORMAT_VERSION，实际：$SF_ACTUAL"; exit 1; }

          ln -sf "$SL_FOUND" "$BIN/swiftlint"
          ln -sf "$SF_BIN" "$BIN/swiftformat"
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/swiftlint" version
          "$BIN/swiftformat" --version

      - name: Guard Siri/AppIntents test line (structural)
        run: python3 scripts/siri-tests-guard.py

      - name: Lint (swiftlint)
        run: swiftlint lint

      - name: Format (swiftformat --lint)
        run: swiftformat --lint .

      # SPM 依赖（SFBAudioEngine 等）首次拉取+编译 30-40 分钟，必须缓存：
      #   - ~/Library/Caches/org.swift.swiftpm（包源码/解析结果）
      #   - build/DerivedData（编译产物，命中后 xcodebuild 增量秒级）
      # key 绑定 Package.resolved 内容，依赖不变即命中。
      - name: Cache SPM packages + DerivedData
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/DerivedData
          # v2: 仓库改名 qqplayer-ios → qqplayer-swift 后 runner 工作目录路径变化，旧缓存内 SPM
          # artifacts 绝对路径指向旧目录导致 "no XCFramework found"，bump key 强制缓存重建。
          # 注意 restore-keys 必须同步带 v2 前缀：v1 旧缓存的 artifacts 绝对路径已失效，
          # 若被 restore-keys 前缀命中会恢复出坏缓存，照样 no XCFramework found。
          key: ${{ runner.os }}-spm-v2-${{ hashFiles('QQPlayer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-v2-

      # destination 动态取第一个可用 iPhone 模拟器：macos-latest runner 的 Xcode/模拟器型号随系统镜像
      # 更新而变（iPhone 16/17 系列都可能），写死型号会随镜像升级失配；动态选取在任何镜像上都成立。
      # （本机已验证等价命令：iPhone 17 Pro 上 xcodebuild test 全绿，9 tests / 2 suites）
      - name: Test (xcodebuild test, iOS simulator)
        run: |
          set -o pipefail
          DEVICE="$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | sed 's/ *$//')"
          if [ -z "$DEVICE" ]; then
            echo "❌ 无可用 iPhone 模拟器（xcrun simctl list devices available）"
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          # tee 落盘供下一步零容忍警告检测；pipefail 保证 xcodebuild 失败不被管道吞掉
          xcodebuild test \
            -project QQPlayer.xcodeproj \
            -scheme QQPlayer \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build/DerivedData \
            -only-testing:QQPlayerTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild-ios.log

      # 编译警告零容忍（2026-09-08 用户立规矩）：源码警告（路径含 /QQPlayer/ 或 /QQPlayerTests/）
      # + 工程级警告（行尾含 "(in target ...)"，如缺 LSApplicationCategory）一律拦截，当场清零。
      # 排除 appintentsmetadataprocessor 的 "Metadata extraction skipped"（无 AppIntents 依赖的
      # 正常工具提示，非编译警告）。三方 SPM 包（路径在 SourcePackages/checkouts）不拦——改不到。
      - name: Check zero warnings (source + target-level)
        run: |
          set -euo pipefail
          WARN="$(grep -E 'warning:' /tmp/xcodebuild-ios.log \
            | grep -v 'Metadata extraction skipped' \
            | grep -E '/(QQPlayer|QQPlayerTests)/|\(in target' \
            | sort -u || true)"
          if [ -n "$WARN" ]; then
            echo "❌ 检测到编译警告（零容忍纪律，须当场清零）："
            printf '%s\n' "$WARN"
            echo "提示：Debug 增量编译会掩盖存量警告，本地请用 Release + 全 target 全量编译核对"
            exit 1
          fi
          echo "✅ 无源码/工程级编译警告"

  macos:
    name: macOS (build QQPlayerMac + 资源产物断言)
    # macOS 原生版（QQPlayerMac target）编译级验证。
    # 历史教训（2026-08-31）：macOS 版首测三 bug 全是"能编译但行为错"——
    # ① App 图标没生效（Contents.json 缺 mac 条目 + target 缺 APPICON_NAME）
    # ② sidebar 与交通灯重叠 ③ 扫描从不执行（isIndexing 未置 true）→ 库永远为空。
    # 其中图标类问题可用产物断言抓住：AppIcon.icns / Assets.car 必须在 app 里。
    # 编译级验证无法覆盖布局/行为，macOS 单测 target 后续补齐。
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Cache SPM packages + DerivedData (macOS)
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/DerivedDataMac
          key: ${{ runner.os }}-spm-mac-v2-${{ hashFiles('QQPlayer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-mac-v2-

      - name: Build QQPlayerMac
        run: |
          set -o pipefail
          # tee 落盘供下一步零容忍警告检测；pipefail 保证 build 失败不被管道吞掉
          xcodebuild build \
            -project QQPlayer.xcodeproj \
            -scheme QQPlayerMac \
            -configuration Debug \
            -derivedDataPath build/DerivedDataMac \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild-macos.log

      # 编译警告零容忍（同 swift job）：macOS target 源码同在 QQPlayer/ 目录，覆盖 QQPlayer/Mac/*
      - name: Check zero warnings (source + target-level)
        run: |
          set -euo pipefail
          WARN="$(grep -E 'warning:' /tmp/xcodebuild-macos.log \
            | grep -v 'Metadata extraction skipped' \
            | grep -E '/(QQPlayer|QQPlayerTests)/|\(in target' \
            | sort -u || true)"
          if [ -n "$WARN" ]; then
            echo "❌ 检测到编译警告（零容忍纪律，须当场清零）："
            printf '%s\n' "$WARN"
            echo "提示：Debug 增量编译会掩盖存量警告，本地请用 Release + 全 target 全量编译核对"
            exit 1
          fi
          echo "✅ 无源码/工程级编译警告"

      - name: Assert app resources (AppIcon + Assets.car)
        run: |
          APP="build/DerivedDataMac/Build/Products/Debug/QQPlayerMac.app"
          test -f "$APP/Contents/Resources/AppIcon.icns" || { echo "❌ AppIcon.icns 缺失——AppIcon.appiconset 无 mac 条目或 target 缺 ASSETCATALOG_COMPILER_APPICON_NAME"; exit 1; }
          test -f "$APP/Contents/Resources/Assets.car" || { echo "❌ Assets.car 缺失——Assets.xcassets 未进 QQPlayerMac target 资源阶段"; exit 1; }
          echo "✅ AppIcon.icns + Assets.car 均在产物中"
